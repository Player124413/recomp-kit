# game.toml - a sample, not a game: sample.exe (src/sample.c, 32-bit, built
# by tools/prepare.py) and Wine's own i386 msvcrt.dll from CrossOver 26.3,
# translated as an auxiliary module. See README.md.
#
# The [hooks] and globals.toml addresses are sentinels in sample.exe's
# zero-filled kit_sentinels array (.data); nothing reads or hooks them.

[game]
id = "wine-msvcrt"
name = "Wine msvcrt sample"
app_name = "WineMsvcrtSample"
bundle_id = "dev.recompkit.sample.winemsvcrt"
executable = "sample.exe"
sha256 = "da17029bb44ef0789ee52a12a3f2c3fdc0642ccd57f7109351530eefd3911f9c"
image_base = 0x00400000
entry_point = 0x00401000
guest_root = 'C:\Sample'
developer_exe = "original/sample.exe"
# Wine links its DLLs at 0x10000000, just past the kit's default arena.
guest_size = 0x10100000

# CrossOver 26.3.0 (Wine) lib/wine/i386-windows/msvcrt.dll, unmodified.
[modules.aux.msvcrt]
name = "msvcrt.dll"
path = "original/msvcrt.dll"
sha256 = "e3202fff5e8d88f4ca4a5cd0bca5764525ac906bbef34899a86f93512bdb6bf6"
base = 0x10000000
size = 0xa2000
listings = "analysis/decompiled/msvcrt.dll"
function_alignment = 4
# A printf-format jump table (in 1003c7e0) names 1003ccde, a block Ghidra's
# listing leaves out: MOV EAX,[EBX+0x40] after an unconditional JMP.
entry_points = [0x1003ccde]

[translate]
# Native replacements for functions the translator cannot model; see the
# header for why msvcrt's memset needs one.
overrides = "native/msvcrt_native.h"
listings = "analysis/decompiled/sample.exe"
globals = "globals.toml"
animation_counter = 0x00404100
volatile_reads = []
entry_points = []

[hooks]
frame_clock_begin = 0x00404110
frame_clock_wait = 0x00404120
frame_clock_wait_clamp = 0x00404130
frame_clock_clamp_deadline = 0x00404140
frame_clock_wait_deadline = 0x00404150
cursor_surface_ptrs = [0x00404160, 0x00404164]
mouse_vtable = 0x00404170
mouse_device_ptr = 0x00404180
mouse_device_right = 0x00404190
camera = 0x004041a0

[touch]
keypad = "hidden"

[bundle]
exclude = []
